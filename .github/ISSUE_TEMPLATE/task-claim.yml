name: 认领 / 分配作业
description: 声明「这块我来做」，避免和别人撞车
title: "[认领] week__ / ____ "
labels: ["认领"]
body:
  - type: markdown
    attributes:
      value: |
        开这个 Issue 之前，先看一眼对应作业的 `接力记录.md` 最后一行，确认没人已经占了这块。

  - type: input
    id: homework
    attributes:
      label: 哪份作业
      description: 例如 week03 / lab02
      placeholder: week03 / lab02
    validations:
      required: true

  - type: input
    id: scope
    attributes:
      label: 你负责的范围
      description: 具体到题号或章节，不要写「全部」
      placeholder: 第 3 题推导 + 数值实验
    validations:
      required: true

  - type: dropdown
    id: status
    attributes:
      label: 开始状态
      options:
        - 全新开始
        - 接手别人的半成品
        - 修正已合并内容的错误
    validations:
      required: true

  - type: input
    id: deadline
    attributes:
      label: 预计什么时候能推上去
      placeholder: 11-09 晚上
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 你希望别人别碰哪部分？需要谁提供什么？
      placeholder: 第 4 题我想留给李四做；我需要 w02 的数据表。
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已在对应作业的 `接力记录.md` 里加了「进行中」的一行
          required: true
        - label: 我读过 CONTRIBUTING.md，知道要开分支而不是直接改 main
          required: true
