name: 问题 / 卡住了
description: 做不下去、git 报错、内容有疑问
title: "[问题] "
labels: ["求助"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - git / GitHub 操作报错
        - 内容或答案有疑问
        - 文件冲突 / 不知道谁在做
        - 其他
    validations:
      required: true

  - type: input
    id: where
    attributes:
      label: 涉及哪份作业
      placeholder: week03/lab02
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: 你做了什么
      description: 尽量按顺序写你敲过的命令
      placeholder: |
        1. git switch -c feat/w03-lab02-zhangsan
        2. 改了第 3 题
        3. git push
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 完整报错 / 现象
      description: 别只截最后一句话，前面几行往往才是原因
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 你试过什么
      placeholder: 试过 git pull --rebase，报了同样的错。
    validations:
      required: false
